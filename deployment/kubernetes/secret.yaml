# IMPORTANT: Create this secret manually with your actual values
# kubectl create secret generic html2pdf-secret \
#   --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#   --from-literal=API_KEYS=your-api-key-1,your-api-key-2 \
#   --namespace html2pdf

apiVersion: v1
kind: Secret
metadata:
  name: html2pdf-secret
  namespace: html2pdf
type: Opaque
stringData:
  # CHANGE THESE VALUES IN PRODUCTION!
  SECRET_KEY: "change-this-to-a-random-string"
  API_KEYS: "test-api-key-1,test-api-key-2"
  API_KEY_REQUIRED: "True"

  # Optional: AWS credentials for S3 storage
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # S3_BUCKET: ""
  # S3_REGION: "us-east-1"
