apiVersion: v1
kind: ConfigMap
metadata:
  name: html2pdf-config
  namespace: html2pdf
data:
  FLASK_ENV: "production"
  DEBUG: "False"
  HOST: "0.0.0.0"
  PORT: "5000"

  # Rate limiting
  RATE_LIMIT_ENABLED: "True"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_PER_HOUR: "1000"

  # Limits
  MAX_UPLOAD_SIZE_MB: "100"
  MAX_HTML_SIZE_MB: "50"
  SYNC_JOB_TIMEOUT_SEC: "30"
  ASYNC_JOB_TIMEOUT_SEC: "600"

  # Celery
  CELERY_BROKER_URL: "redis://redis.html2pdf.svc.cluster.local:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis.html2pdf.svc.cluster.local:6379/0"
  CELERY_WORKER_CONCURRENCY: "4"

  # Redis
  REDIS_URL: "redis://redis.html2pdf.svc.cluster.local:6379/1"
  JOB_RESULT_TTL_SEC: "3600"

  # Storage
  STORAGE_TYPE: "local"
  STORAGE_PATH: "/app/data/pdfs"

  # Chromium
  CHROMIUM_POOL_SIZE: "4"
  CHROMIUM_TIMEOUT_MS: "30000"
  DEFAULT_DPI: "96"

  # Security
  ALLOW_URL_RENDERING: "True"
  SANITIZE_HTML: "True"
  ALLOW_INLINE_SCRIPTS: "False"
  DISABLE_JAVASCRIPT: "False"
  NETWORK_ISOLATION: "False"

  # Defaults
  DEFAULT_FORMAT: "A4"
  LOG_LEVEL: "INFO"
