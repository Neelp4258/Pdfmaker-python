version: '3.8'

services:
  # Redis for Celery broker and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask API service
  api:
    build:
      context: .
      target: application
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - SECRET_KEY=change-this-in-production
      - API_KEY_REQUIRED=True
      - API_KEYS=test-api-key-1,test-api-key-2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_PATH=/app/data/pdfs
      - MAX_UPLOAD_SIZE_MB=100
      - SYNC_JOB_TIMEOUT_SEC=30
      - ASYNC_JOB_TIMEOUT_SEC=600
      - RATE_LIMIT_ENABLED=True
      - RATE_LIMIT_PER_MINUTE=60
      - RATE_LIMIT_PER_HOUR=1000
      - LOG_LEVEL=INFO
    volumes:
      - pdf_storage:/app/data/pdfs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery worker for async PDF generation
  worker:
    build:
      context: .
      target: worker
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_PATH=/app/data/pdfs
      - CELERY_WORKER_CONCURRENCY=4
      - CHROMIUM_TIMEOUT_MS=30000
      - LOG_LEVEL=INFO
    volumes:
      - pdf_storage:/app/data/pdfs
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Optional: Flower for Celery monitoring
  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      - redis
      - worker
    command: celery --broker=redis://redis:6379/0 flower --port=5555

volumes:
  redis_data:
  pdf_storage:

networks:
  default:
    driver: bridge
