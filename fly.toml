# Fly.io Configuration for HTML2PDF Service
# Deploy with: fly deploy

app = "html2pdf"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "5s"

[experimental]
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  PORT = "5000"
  FLASK_ENV = "production"
  DEBUG = "False"
  API_KEY_REQUIRED = "True"
  STORAGE_TYPE = "local"
  STORAGE_PATH = "/app/data/pdfs"
  MAX_UPLOAD_SIZE_MB = "100"
  SYNC_JOB_TIMEOUT_SEC = "30"
  ASYNC_JOB_TIMEOUT_SEC = "600"
  RATE_LIMIT_PER_MINUTE = "60"
  RATE_LIMIT_PER_HOUR = "1000"
  DEFAULT_FORMAT = "A4"
  LOG_LEVEL = "INFO"

[[services]]
  protocol = "tcp"
  internal_port = 5000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    restart_limit = 0

  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_gb = 1

[mounts]
  source = "pdf_storage"
  destination = "/app/data/pdfs"

# Autoscaling configuration
[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Deploy multiple regions for global edge deployment (optional)
# [[regions]]
# primary = "sjc"  # San Jose
# backup = ["dfw", "lhr"]  # Dallas, London

# Notes:
# 1. Set secrets with: fly secrets set API_KEYS=your-key SECRET_KEY=random-string
# 2. Create Redis: fly redis create
# 3. Connect Redis: fly redis connect
# 4. Scale: fly scale count 2
# 5. Free tier: 3 shared-cpu-1x VMs with 256MB RAM each
