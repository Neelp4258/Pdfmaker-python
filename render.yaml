# Render Blueprint for HTML2PDF Service
# Deploy to Render with one click!

services:
  # Main API Service
  - type: web
    name: html2pdf-api
    env: docker
    plan: standard  # REQUIRES 2GB+ RAM for Chromium! Use 'standard' or 'pro'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: false
      - key: API_KEY_REQUIRED
        value: true
      - key: API_KEYS
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: html2pdf-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: html2pdf-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: html2pdf-redis
          property: connectionString
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_PATH
        value: /tmp/html2pdf
      - key: MAX_UPLOAD_SIZE_MB
        value: 100
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: RATE_LIMIT_PER_HOUR
        value: 1000
      - key: DEFAULT_FORMAT
        value: A4
      - key: DEFAULT_DPI
        value: 96
      - key: GENERATION_PASSWORD_REQUIRED
        value: true
      - key: GENERATION_PASSWORD
        value: Bhavani@102005
      - key: CHROMIUM_POOL_SIZE
        value: 1  # Reduce to 1 to save memory (each instance = ~300MB RAM)
      - key: PAGE_LOAD_STRATEGY
        value: networkidle
      - key: CHROMIUM_TIMEOUT_MS
        value: 60000

  # Celery Worker Service
  - type: worker
    name: html2pdf-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=1
    plan: standard  # REQUIRES 2GB+ RAM for Chromium! Use 'standard' or 'pro'
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: html2pdf-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: html2pdf-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: html2pdf-redis
          property: connectionString
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_PATH
        value: /tmp/html2pdf
      - key: CELERY_WORKER_CONCURRENCY
        value: 1  # Reduce to 1 to save memory
      - key: CHROMIUM_POOL_SIZE
        value: 1  # Reduce to 1 to save memory (each instance = ~300MB RAM)
      - key: PAGE_LOAD_STRATEGY
        value: networkidle
      - key: CHROMIUM_TIMEOUT_MS
        value: 60000

  # Redis Service
  - type: redis
    name: html2pdf-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# Notes:
# 1. After deployment, update API_KEYS in the Render dashboard
# 2. IMPORTANT: Chromium requires at least 2GB RAM!
#    - Starter plan (512MB) = OUT OF MEMORY ERRORS ❌
#    - Standard plan (2GB) = Works properly ✅
#    - Pro plan (4GB+) = Recommended for production ✅
# 3. Free tier services sleep after 15 minutes of inactivity
# 4. Pricing (as of 2024):
#    - Starter: $7/month per service (512MB RAM - NOT ENOUGH)
#    - Standard: $25/month per service (2GB RAM - MINIMUM REQUIRED)
#    - Pro: $85/month per service (4GB RAM - RECOMMENDED)
# 5. Memory optimization tips:
#    - CHROMIUM_POOL_SIZE=1 reduces RAM usage
#    - Use async endpoint (/render) instead of sync for large files
#    - Consider using domcontentloaded instead of networkidle for faster/less memory
